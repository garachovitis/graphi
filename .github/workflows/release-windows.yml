name: Release Windows (.exe)

# Τρέχει όταν σπρώχνεται tag τύπου v1.2.3 (δημιουργεί GitHub Release με τα .exe),
# ή χειροκίνητα από το tab Actions (μόνο build — τα .exe μένουν ως artifact του run).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Έλεγχος ότι το tag ταιριάζει με το version του package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Το tag είναι $GITHUB_REF_NAME αλλά το package.json λέει $PKG. Τρέξε 'npm version <x.y.z>' πριν το tag."
            exit 1
          fi

      - run: npm ci

      - name: Build (Vite + electron-builder --win)
        run: npm run dist:win -- --publish never
        env:
          # Χωρίς πιστοποιητικό το .exe βγαίνει ανυπόγραφο (SmartScreen warning).
          # Αν προστεθούν τα secrets WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD, υπογράφεται αυτόματα.
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: grafi-windows
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Grafi ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
